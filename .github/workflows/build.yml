name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # This is needed to be able to run ./gradlew below
      # You can run `git update-index --chmod +x gradlew` then remove this step.
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Probe Minecraft API (temporary)
        if: always()
        run: |
          J=$(find ~/.gradle -name "*.jar" -size +5M 2>/dev/null | while read j; do unzip -l "$j" 2>/dev/null | grep -q "net/minecraft/world/level/block/LeavesBlock.class" && echo "$j" && break; done)
          echo "JAR=$J"
          unzip -l "$J" | grep -o "net/minecraft/world/level/block/[A-Za-z]*Leaves[A-Za-z]*.class" | sort -u
          for c in net.minecraft.world.level.block.LeavesBlock net.minecraft.world.level.block.UntintedParticleLeavesBlock net.minecraft.world.level.block.TintedParticleLeavesBlock net.minecraft.world.level.block.SaplingBlock net.minecraft.world.level.block.grower.TreeGrower net.minecraft.core.particles.ColorParticleOption; do echo "=== $c"; javap -cp "$J" "$c" | grep -E "public|protected" || true; done
          echo "=== ParticleTypes leaves"; javap -cp "$J" net.minecraft.core.particles.ParticleTypes | grep -i -E "LEAVES" || true
          echo "=== Blocks leaves props"; javap -cp "$J" net.minecraft.world.level.block.Blocks | grep -i -E "leavesProperties|leaves\(" || true

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: edition1-build-artifact
          path: build/libs/*.jar
          retention-days: 7