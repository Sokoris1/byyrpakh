name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # This is needed to be able to run ./gradlew below
      # You can run `git update-index --chmod +x gradlew` then remove this step.
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Probe Minecraft API (temporary)
        if: always()
        run: |
          J=$(find ~/.gradle -name "*.jar" -size +5M 2>/dev/null | while read j; do unzip -l "$j" 2>/dev/null | grep -q "net/minecraft/world/level/block/FlowerBlock.class" && echo "$j" && break; done)
          echo "JAR=$J"
          for c in net.minecraft.world.level.block.FlowerBlock net.minecraft.world.level.block.FlowerPotBlock; do echo "=== $c"; javap -cp "$J" "$c" | grep -E "public|protected" || true; done
          echo "=== Properties"; javap -cp "$J" 'net.minecraft.world.level.block.state.BlockBehaviour$Properties' | grep -i -E "offsetType|ofFullCopy|ofLegacyCopy" || true
          N=$(find ~/.gradle -name "neoforge-*-universal.jar" -o -name "neoforge-26*.jar" 2>/dev/null | head -3); echo "NEO=$N"
          for n in $N; do javap -cp "$n" 'net.neoforged.neoforge.registries.DeferredRegister$Items' 2>/dev/null | grep -i blockitem || true; done
          D=$(find ~/.gradle -path "*neoforge*" -name "*.jar" 2>/dev/null | while read j; do unzip -l "$j" 2>/dev/null | grep -q 'DeferredRegister$Items.class' && echo "$j" && break; done); echo "DR=$D"; javap -cp "$D" 'net.neoforged.neoforge.registries.DeferredRegister$Items' | grep -i -E "block" || true

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: edition1-build-artifact
          path: build/libs/*.jar
          retention-days: 7